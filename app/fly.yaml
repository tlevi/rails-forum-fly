# fly.yaml app configuration file generated for railsforum on 2024-10-25T15:50:05+10:30
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app: railsforum
primary_region: iad

build:
  dockerfile: Dockerfile
  ignorefile: .dockerignore

http_service:
  internal_port: 3000
  force_https: true
  auto_stop_machines: true
  auto_start_machines: true
  min_machines_running: 0

  processes:
    - app

vm:
  - size: shared-cpu-1x

checks:
  http_check:
    grace_period: 30
    interval: 1m
    type: http
    method: get
    path: /
    port: 3000
    timeout: 10
